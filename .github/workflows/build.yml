name: 构建

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本名称（留空则自动使用 日期-短哈希）"
        required: false
        type: string
      custom_build_tags:
        description: "自定义 Go 构建标签（留空则使用 release/DEFAULT_BUILD_TAGS）"
        required: false
        type: string
      release_target:
        description: "发布目标"
        required: true
        type: choice
        default: "prerelease"
        options:
          - prerelease
          - release
          - none
  push:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.release_target }}
  cancel-in-progress: true

jobs:
  calculate_version:
    name: 计算版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.outputs.outputs.version }}
      release_target: ${{ steps.outputs.outputs.release_target }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: 计算版本号
        id: outputs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TARGET: ${{ inputs.release_target }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |-
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${INPUT_VERSION}" ]]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          fi
          if [[ ! "${VERSION}" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]{0,127}$ ]]; then
            echo "版本号格式无效：${VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "计算出的版本号：${VERSION}"

          if [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ "${REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
              RELEASE_TARGET="prerelease"
            else
              RELEASE_TARGET="none"
            fi
          else
            RELEASE_TARGET="${INPUT_RELEASE_TARGET}"
          fi
          case "${RELEASE_TARGET}" in
            prerelease|release|none) ;;
            *)
              echo "发布目标无效：${RELEASE_TARGET}" >&2
              exit 1
              ;;
          esac
          echo "release_target=${RELEASE_TARGET}" >> "$GITHUB_OUTPUT"

  build_linux:
    name: 构建 Linux (${{ matrix.arch }})
    needs:
      - calculate_version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64 }
          - { arch: arm64 }
          - { arch: "386" }
          - { arch: arm, goarm: "7" }
          - { arch: riscv64 }
          - { arch: loong64 }
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: 配置 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: false
      - name: 缓存 Go 模块
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-go1.26.5-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-go1.26.5-
      - name: 缓存 Go 构建结果
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-go1.26.5-linux-${{ matrix.arch }}${{ matrix.goarm && format('v{0}', matrix.goarm) }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-${{ runner.os }}-go1.26.5-linux-${{ matrix.arch }}${{ matrix.goarm && format('v{0}', matrix.goarm) }}-
      - name: 检出 fork 依赖
        run: bash .github/scripts/setup-fork-deps.sh
      - name: 设置构建标签
        env:
          INPUT_BUILD_TAGS: ${{ inputs.custom_build_tags }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_BUILD_TAGS}" ]]; then
            TAGS="${INPUT_BUILD_TAGS}"
          else
            TAGS=$(cat release/DEFAULT_BUILD_TAGS)
          fi
          echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"
      - name: 设置共享 ldflags
        run: |
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "${GITHUB_ENV}"
      - name: 构建
        run: |
          set -xeuo pipefail
          mkdir -p dist
          go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
          ./cmd/sing-box
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 打包归档
        run: |
          set -xeuo pipefail
          DIR_NAME="sing-box-${{ needs.calculate_version.outputs.version }}-linux-${{ matrix.arch }}"
          if [[ -n "${{ matrix.goarm }}" ]]; then
            DIR_NAME="${DIR_NAME}v${{ matrix.goarm }}"
          fi
          cd dist
          mkdir -p "${DIR_NAME}"
          cp ../LICENSE "${DIR_NAME}"
          cp sing-box "${DIR_NAME}"
          tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          rm -r "${DIR_NAME}"
      - name: 清理
        run: rm -f dist/sing-box
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: binary-linux_${{ matrix.arch }}${{ matrix.goarm && format('v{0}', matrix.goarm) }}
          path: "dist"
          compression-level: 0
          retention-days: 3

  build_android:
    name: 构建 Android (${{ matrix.arch }})
    needs:
      - calculate_version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, ndk: "aarch64-linux-android23" }
          - { arch: arm, ndk: "armv7a-linux-androideabi23" }
          - { arch: amd64, ndk: "x86_64-linux-android23" }
          - { arch: "386", ndk: "i686-linux-android23" }
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: 配置 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.5
          cache: false
      - name: 缓存 Go 模块
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-go1.26.5-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-go1.26.5-
      - name: 缓存 Go 构建结果
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-go1.26.5-android-${{ matrix.arch }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-${{ runner.os }}-go1.26.5-android-${{ matrix.arch }}-
      - name: 检出 fork 依赖
        run: bash .github/scripts/setup-fork-deps.sh
      - name: 配置 Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
      - name: 设置构建标签
        env:
          INPUT_BUILD_TAGS: ${{ inputs.custom_build_tags }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_BUILD_TAGS}" ]]; then
            TAGS="${INPUT_BUILD_TAGS}"
          else
            TAGS=$(cat release/DEFAULT_BUILD_TAGS_ANDROID)
          fi
          echo "BUILD_TAGS=${TAGS}" >> "${GITHUB_ENV}"
      - name: 设置共享 ldflags
        run: |
          echo "LDFLAGS_SHARED=$(cat release/LDFLAGS)" >> "${GITHUB_ENV}"
      - name: 构建
        run: |
          set -xeuo pipefail
          go install -v ./cmd/internal/build
          export CC='${{ matrix.ndk }}-clang'
          export CXX="${CC}++"
          mkdir -p dist
          GOOS=android GOARCH=${{ matrix.arch }} build go build -v -trimpath -o dist/sing-box -tags "${BUILD_TAGS}" \
          -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${{ needs.calculate_version.outputs.version }}' ${LDFLAGS_SHARED} -s -w -buildid=" \
          ./cmd/sing-box
        env:
          CGO_ENABLED: "1"
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 打包归档
        run: |
          set -xeuo pipefail
          DIR_NAME="sing-box-${{ needs.calculate_version.outputs.version }}-android-${{ matrix.arch }}"
          cd dist
          mkdir -p "${DIR_NAME}"
          cp ../LICENSE "${DIR_NAME}"
          cp sing-box "${DIR_NAME}"
          tar -czvf "${DIR_NAME}.tar.gz" "${DIR_NAME}"
          rm -r "${DIR_NAME}"
      - name: 清理
        run: rm -f dist/sing-box
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: binary-android_${{ matrix.arch }}
          path: "dist"
          compression-level: 0
          retention-days: 3

  upload:
    name: 上传构建结果
    if: ${{ needs.calculate_version.outputs.release_target != 'none' && !failure() }}
    concurrency:
      group: release-${{ needs.calculate_version.outputs.release_target == 'prerelease' && 'dev' || needs.calculate_version.outputs.version }}
      cancel-in-progress: false
    needs:
      - calculate_version
      - build_linux
      - build_android
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: 为构建产物生成溯源证明
        uses: actions/attest@v4
        with:
          subject-path: 'dist/**'
      - name: 发布构建结果
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TARGET: ${{ needs.calculate_version.outputs.release_target }}
          VERSION: ${{ needs.calculate_version.outputs.version }}
        run: |-
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          NOTES_FILE="${RUNNER_TEMP}/release_notes.md"
          case "${RELEASE_TARGET}" in
            prerelease)
              TAG="dev"
              TITLE="开发版 (Prerelease) ${VERSION}"
              PRERELEASE_ARGS=(--prerelease)
              printf '%s\n' \
                "自动构建的开发预发布版本。" \
                "" \
                "版本号：\`${VERSION}\`" \
                "提交：\`${SHA:0:7}\`" \
                "构建时间：\`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`" \
                "" \
                "> 该版本由 GitHub Actions 自动构建并发布，仅供测试用途。" \
                > "${NOTES_FILE}"
              ;;
            release)
              TAG="v${VERSION}"
              TITLE="sing-box ${VERSION}"
              PRERELEASE_ARGS=()
              printf '%s\n' \
                "sing-box ${VERSION} 正式发布。" \
                "" \
                "提交：\`${SHA:0:7}\`" \
                "构建时间：\`$(date -u +%Y-%m-%dT%H:%M:%SZ)\`" \
                > "${NOTES_FILE}"
              ;;
            *)
              echo "不支持的发布目标：${RELEASE_TARGET}" >&2
              exit 1
              ;;
          esac

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release delete "${TAG}" --cleanup-tag --yes
          fi
          gh release create "${TAG}" dist/* \
            --target "${SHA}" \
            --title "${TITLE}" \
            --notes-file "${NOTES_FILE}" \
            "${PRERELEASE_ARGS[@]}"

  cache_gc:
    name: 缓存清理
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    needs:
      - build_linux
      - build_android
      - upload
    steps:
      - name: 删除被取代的缓存
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" --paginate \
            --jq '.actions_caches[] | [.id, .ref, .created_at, .last_accessed_at, .size_in_bytes, .key] | @tsv' > "$RUNNER_TEMP/caches.tsv"
          python3 - "$GITHUB_REPOSITORY" "$RUNNER_TEMP/caches.tsv" <<'EOF'
          import re
          import subprocess
          import sys

          repository, list_path = sys.argv[1], sys.argv[2]
          budget = 9 * 1024 * 1024 * 1024
          rows = []
          with open(list_path) as list_file:
              for line in list_file:
                  cache_id, ref, created_at, accessed_at, size, key = line.rstrip("\n").split("\t")
                  family = key
                  while True:
                      stripped = re.sub(r"-[0-9a-f]{16,}$", "", family)
                      if stripped == family:
                          break
                      family = stripped
                  rows.append({
                      "id": cache_id, "ref": ref, "created": created_at,
                      "accessed": accessed_at, "size": int(size), "key": key,
                      "family": family,
                  })
          newest = {}
          for row in rows:
              group = (row["ref"], row["family"])
              if group not in newest or row["created"] > newest[group]["created"]:
                  newest[group] = row
          for row in rows:
              row["newest"] = row is newest[(row["ref"], row["family"])]
          rows.sort(key=lambda r: (-r["size"], r["accessed"], r["created"]))
          for row in rows:
              print(f"{row['id']}\t{row['size']}\t{row['key']}\t是否最新={row['newest']}\t最后访问={row['accessed']}")
          kept = 0
          for row in rows:
              if row["newest"]:
                  kept += row["size"]
              elif kept + row["size"] > budget:
                  print(f"正在删除缓存 {row['id']}（大小={row['size']}）键={row['key']}")
                  subprocess.run(["gh", "api", "--method", "DELETE", f"repos/{repository}/actions/caches/{row['id']}"], check=True)
              else:
                  kept += row["size"]
          EOF
